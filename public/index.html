<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Minhas Tarefas</h1>

    <form id="form-tarefa">
      <input
        type="text"
        id="input-titulo"
        placeholder="Nova tarefa..."
        required
      >
      <input
        type="text"
        id="input-descricao"
        placeholder="Descricao (opcional)"
      >
      <input
        type="number"
        id="input-tempo"
        min="1"
        placeholder="Tempo (minutos, opcional)"
      >
      <button type="submit">Adicionar</button>
    </form>

    <dialog id="modal-edicao">
      <div class="modal-conteudo">
        <h3>Editar tarefa</h3>
        <input type="hidden" id="edit-id">
        <label>Titulo</label>
        <input type="text" id="edit-titulo" required>
        <label>Descricao</label>
        <input type="text" id="edit-descricao">
        <label>Tempo (minutos)</label>
        <input type="number" id="edit-tempo" min="0" placeholder="0 = sem tempo">
        <div class="modal-botoes">
          <button type="button" id="btn-salvar-edicao">Salvar</button>
          <button type="button" id="btn-cancelar-edicao">Cancelar</button>
        </div>
      </div>
    </dialog>

    <div id="lista-tarefas" class="tarefas-grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
